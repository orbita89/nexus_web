<style>
  .t {
    position: relative; height: 100%; display: flex; align-items: center;

  .bg {

      center / cover no-repeat;
  }
  .bg::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(7,3,3,.92) 0%,

  }
  .fog {
    position: absolute; left: -50%; right: -50%; bottom: -20%; height: 55%;
    pointer-events: none; filter: blur(8px);

  }
  @keyframes fog { from { transform: translateX(-8%) } to { transform: translateX(8%) } }
  .txt { position: relative; flex: 1; min-width: 0; z-index: 1 }

  }
  h2 {

  }

  .btn {
    padding: 8px 16px; border-radius: 999px; background: #e11d1d; color: #fff;
    text-decoration: none; font-size: 14px; font-weight: 600;

  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(225,29,29,.6) }
    70%, 100% { box-shadow: 0 0 0 12px rgba(225,29,29,0) }
  }

  .posters { position: relative; display: flex; z-index: 1 }

    background: #2a0a0a; transition: transform .25s;
    box-shadow: 0 12px 34px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.1);
  }
  .posters a:first-child { margin-left: 0 }
  .posters a:nth-child(1) { transform: rotate(-7deg) translateY(12px) }
  .posters a:nth-child(2) { z-index: 1 }
  .posters a:nth-child(3) { transform: rotate(7deg) translateY(12px) }
  .posters a:hover { transform: scale(1.08) rotate(0); z-index: 2 }
  .posters img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover }
  /* Декор Хеллоуина: летучие мыши, тыквы, черепа, паутина */
  .deco { position: absolute; inset: 0; pointer-events: none; z-index: 0 }
  .deco span { position: absolute; line-height: 1; user-select: none }
  .bat { font-size: 26px; opacity: .85; animation: fly 9s ease-in-out infinite }
  .b1 { top: 10%; left: 40%; }
  .b2 { top: 22%; left: 55%; font-size: 18px; animation-delay: -3s }
  .b3 { top: 6%; left: 68%; font-size: 14px; animation-delay: -6s }
  @keyframes fly {
    0%, 100% { transform: translate(0, 0) rotate(-6deg) }
    25% { transform: translate(30px, -12px) rotate(8deg) }
    50% { transform: translate(60px, 6px) rotate(-4deg) }
    75% { transform: translate(24px, 14px) rotate(6deg) }
  }
  .pumpkin {
    bottom: 6%; font-size: 40px; filter: drop-shadow(0 0 14px rgba(255,120,0,.9));
    animation: glow 3s ease-in-out infinite;
  }
  .p1 { left: 42%; }
  .p2 { left: 49%; bottom: 4%; font-size: 28px; animation-delay: -1.5s }
  @keyframes glow {
    0%, 100% { filter: drop-shadow(0 0 8px rgba(255,120,0,.6)) }
    50% { filter: drop-shadow(0 0 22px rgba(255,140,0,1)) }
  }
  .skull {
    top: 8%; right: 3%; font-size: 30px; opacity: .8;
    animation: sway 4s ease-in-out infinite; transform-origin: 50% -40px;
  }
  .skull::before {
    content: ""; position: absolute; left: 50%; bottom: 100%;
    width: 1px; height: 60px; background: rgba(255,255,255,.35);
  }
  @keyframes sway { 0%, 100% { transform: rotate(-8deg) } 50% { transform: rotate(8deg) } }
  .web {
    top: -4px; left: -4px; width: 120px; height: 120px; opacity: .25;
    background:
      repeating-radial-gradient(circle at 0 0, transparent 0 14px,
        rgba(255,255,255,.8) 14px 15px),
      repeating-conic-gradient(from 0deg at 0 0, transparent 0 8deg,
        rgba(255,255,255,.8) 8deg 9deg, transparent 9deg 18deg);
    -webkit-mask: radial-gradient(circle at 0 0, #000 60%, transparent 72%);
    mask: radial-gradient(circle at 0 0, #000 60%, transparent 72%);
  }
  .ghost {
    bottom: 18%; right: 34%; font-size: 30px; opacity: 0;
    animation: boo 7s ease-in-out infinite;
  }
  @keyframes boo {
    0%, 60%, 100% { opacity: 0; transform: translateY(10px) }
    70%, 85% { opacity: .7; transform: translateY(-6px) }
  }
  @media (max-width: 640px) {
    .deco .p1, .deco .p2, .deco .ghost, .deco .b3 { display: none }
    .t { flex-direction: column; align-items: flex-start; padding: 20px; gap: 16px }
    .posters { order: -1 }
    .posters a { width: 72px; margin-left: -16px }
    .bg::after { background: rgba(7,3,3,.72) }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important }
  }
