name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Бэкенд (orbita89/nexus_project) нужен для двух вещей: OpenAPI-контракты (не устарели ли типы)
# и живой API для e2e. Если репозиторий приватный — задайте секрет BACKEND_REPO_TOKEN
# (fine-grained token с правом Contents: read на nexus_project).

jobs:
  check:
    name: lint, types, unit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: web
      - uses: actions/checkout@v5
        with:
          repository: orbita89/nexus_project
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}
          path: backend
          sparse-checkout: documents/api
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm lint
        working-directory: web
      - run: pnpm check
        working-directory: web
      - name: API-типы совпадают с контрактом бэкенда
        run: pnpm api:check
        working-directory: web
        env:
          NEXUS_BACKEND_DIR: ../backend
      - run: pnpm vitest --run
        working-directory: web
      # Бэкенда в этой джобе нет: сборка без статики карточек (e2e ниже собирает с ней).
      - run: pnpm build
        working-directory: web
        env:
          PRERENDER_ENTITIES: '0'

  e2e:
    name: e2e against backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: web
      - uses: actions/checkout@v5
        with:
          repository: orbita89/nexus_project
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}
          path: backend
      - name: Поднять бэкенд
        working-directory: backend
        run: |
          make up
          for i in $(seq 1 90); do curl -fsS http://localhost/health && break; sleep 2; done
          make seed
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm test:e2e
        working-directory: web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
      - if: failure()
        working-directory: backend
        run: docker compose -f infra/docker-compose.yml logs app --tail 200
