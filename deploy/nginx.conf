# Фронтенд Nexus за nginx: пример server-блока. Релиз лежит в /srv/nexus-web/current
# (симлинк на releases/<id>), Node — `node server/index.js` на 127.0.0.1:3000.
# brotli_static — модуль ngx_brotli; без него уберите строки brotli_static, останется gzip.

upstream nexus_web {
	server 127.0.0.1:3000;
	keepalive 32;
}

server {
	listen 443 ssl;
	http2 on;
	server_name nexus.example;

	# Без open_file_cache: ISR заменяет файлы через rename, а кэш дескрипторов держал бы старые.

	# location /api/ и /ws — на бэкенд, как сейчас.

	# Перерисовка карточек — только с этой машины, напрямую на 127.0.0.1:3000.
	location /_isr/ {
		return 404;
	}

	# Ассеты сборки: в имени хэш — кэш навсегда.
	location /_app/immutable/ {
		root /srv/nexus-web/current/build/client;
		gzip_static on;
		brotli_static on;
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	# Карточки: HTML и __data.json с диска. Query (?sort=, ?x-sveltekit-invalidated=) не влияет —
	# файл один. Нет файла — Node рисует, сохраняет и отдаёт (дальше снова с диска).
	# Браузер переспрашивает каждый раз (ETag → 304): после ISR новая версия видна сразу.
	location ~ "^/(films|series|books|games)/[a-z0-9]+(-[a-z0-9]+)*(/__data\.json)?$" {
		root /srv/nexus-web/current/build/prerendered;
		gzip_static on;
		brotli_static on;
		add_header Cache-Control "public, max-age=0, must-revalidate";
		try_files $uri.html $uri @app;
	}

	# Остальное: статика из static/, затем SvelteKit (SSR).
	location / {
		root /srv/nexus-web/current/build/client;
		gzip_static on;
		brotli_static on;
		try_files $uri @app;
	}

	location @app {
		proxy_pass http://nexus_web;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
